name: CI

on:
  push:
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      # Pinned to commit SHAs: a mutable tag can be repointed by a third party.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.3.1

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # sounddevice binds PortAudio at import; on Linux the wheel needs the system library
      # present (the macOS/Windows wheels bundle it). The speak tests import the audio
      # backends, so install it before running with the [speak] extra.
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      # Run with the optional [speak] extra so the speak-service tests (real decode via
      # soundfile/miniaudio/soxr, plus the audio-backend probe) run; the modules import
      # lazily (KTD9), so the rest of the suite is unaffected either way.
      - name: Tests
        run: uv run --extra speak pytest

      # The honesty gate, invoked by name rather than relying on `pytest` collecting it.
      # A bare `uv run pytest` reports success on whatever it happens to find, so deleting
      # or skipping the invariant suite would leave every step above green.
      - name: Honesty gate
        run: uv run pytest tests/test_table_invariants.py -q

      # And again without pytest at all, so the gate survives the suite being weakened.
      - name: Command table is valid
        run: |
          uv run python -c "
          import sys
          from carle.table import load_seeded_ids, load_table, validate_table
          table = load_table()
          seeded = load_seeded_ids()
          problems = validate_table(table, seeded_ids=seeded)
          for problem in problems:
              print(problem, file=sys.stderr)
          if not seeded:
              print('seeded id snapshot is empty', file=sys.stderr)
          sys.exit(1 if problems or not seeded else 0)
          "

      - name: Reference is current
        run: uv run python scripts/generate_reference.py --check
