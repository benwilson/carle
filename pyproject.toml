[project]
name = "carle"
version = "0.1.0"
description = "A documented BLE protocol reference for the Ruko 1088 robot, and the CLI that proves it"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0",
    "bleak>=3.0,<4.0",
]

[project.optional-dependencies]
# The MCP server is optional: the daemon and CLI need only the base dependencies.
mcp = ["mcp>=1.0"]
speak = [
    "miniaudio>=1.71",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[project.scripts]
carle = "carle.cli:main"
carle-mcp = "carle.daemon.mcp_server:main"

[project.urls]
Homepage = "https://github.com/benwilson/carle"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "hypothesis>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carle"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
