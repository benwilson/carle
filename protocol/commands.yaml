- id: move_rocker
  capability: Drive movement and limbs; direction 1-8 counter-clockwise from RIGHT
  category: movement
  provenance: decompile
  status: confirmed
  derivation: NormolContorlActivity.sendconmmde() — decompiled from base.apk (com.ihunuo.jtlrobot)
  family: '0xB6'
  payload:
  - '{mode}'
  - '{speed}'
  - '{direction}'
  - '{p3}'
  - '{limb}'
  - '{p5}'
  parameters:
    mode:
      min: 0
      max: 2
      default: 0
    speed:
      min: 0
      max: 255
      default: 0
    direction:
      min: 0
      max: 8
      default: 0
    p3:
      min: 0
      max: 2
      default: 0
    limb:
      min: 0
      max: 12
      default: 0
    p5:
      min: 0
      max: 255
      default: 0
  observations:
  - parameters:
      direction: 3
      speed: 50
    behavior: Walked forward. Sent with mode at its default of 0, speed 50 and direction 3, which
      confirms the direction mapping derived from NormolContorlActivity (counter-clockwise from RIGHT=1,
      so 3 is up/forward) and shows that mode is not an enable — the app only ever writes 1 or 2 there,
      but 0 moves the robot.
    evidence:
      date: '2026-08-11'
      platform: darwin
      logs:
      - evidence/move_rocker-20260811T211646910616Z.log
  - parameters:
      limb: 1
    behavior: Left arm raised, as though offering a handshake. The arm STAYS raised — these are poses,
      not gestures.
